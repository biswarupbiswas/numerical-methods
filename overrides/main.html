{% extends "base.html" %}

{% block htmltitle %}

    <title>{{ config.site_name }}</title>
  {% else %}
    {{ super() }}
  {% endif %}
{% endblock %}

{% block extrahead %}
  {{ super() }}
  <link rel="apple-touch-icon" href="{{ 'assets/images/apple-touch-icon.png' | url }}">
{% endblock %}
