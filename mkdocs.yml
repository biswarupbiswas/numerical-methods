site_name: Numerical Methods
site_description: Visual lectures and self-paced practice for a first course in Numerical Methods.
site_author: Biswarup Biswas
site_url: https://biswarupbiswas.github.io/numerical-methods/
repo_url: https://github.com/biswarupbiswas/numerical-methods
repo_name: numerical-methods
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    logo: material/function-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Lectures:
      - "1 · Bisection Method": lectures/lec01-bisection.md
      - "2 · Secant Method": lectures/lec02-secant.md
      - "3 · Regula Falsi": lectures/lec03-regula-falsi.md
      - "4 · Newton–Raphson": lectures/lec04-newton.md
      - "5 · Fixed-Point Iteration": lectures/lec05-fixed-point.md
      - "6 · Fixed-Point Convergence": lectures/lec06-fixed-point-convergence.md
      - "7 · Order and Modified Newton": lectures/lec07-order-modified-newton.md
      - "8 · Floating-Point Numbers": lectures/lec08-floating-point.md
      - "9 · Machine Epsilon": lectures/lec09-rounding-errors.md
      - "10 · Gaussian Elimination": lectures/lec10-gaussian-elimination.md
      - "11 · Operation Count": lectures/lec11-operation-count.md
      - "12 · Pivoting": lectures/lec12-pivoting.md
      - "13 · LU Factorisation": lectures/lec13-lu.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false

copyright: "© 2026 Biswarup Biswas"

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,650&display=swap
  - stylesheets/extra.css
  - stylesheets/home.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/katex.js
