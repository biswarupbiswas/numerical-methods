site_name: Numerical Methods
site_description: Visual lectures and self-paced practice for a first course in Numerical Methods.
site_author: Biswarup Biswas
site_url: https://biswarupbiswas.github.io/numerical-methods/
repo_url: https://github.com/biswarupbiswas/numerical-methods
repo_name: numerical-methods
edit_uri: ""

theme:
  name: material
  language: en
  icon:
    logo: material/function-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Lectures:
      - "1 · Bisection Method": lectures/lec01-bisection.md
      - "2 · Secant Method": lectures/lec02-secant.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
