<script>
"use strict";
const STORE = "nm-lec02-secant-v1";
const f = x => x ** 3 + 2 * x ** 2 - x - 1;
const ROOT = 0.8019377358048383;

/* ---------------- tiny plotting library (canvas, theme-aware) ---------------- */
class Plot {
  constructor(canvas) {
    this.cv = canvas; this.ctx = canvas.getContext("2d"); this.items = []; this.view = [0, 1, 0, 1]; this.opts = {};
    new ResizeObserver(() => this.draw()).observe(canvas);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => this.draw());
    new MutationObserver(() => this.draw()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }
  setView(x0, x1, y0, y1, opts = {}) { this.view = [x0, x1, y0, y1]; this.opts = opts; this.items = []; }
  add(item) { this.items.push(item); return item; }
  fn(g, o = {}) { return this.add({ t: "fn", g, color: "curve", width: 3, ...o }); }
  seg(x1, y1, x2, y2, o = {}) { return this.add({ t: "seg", x1, y1, x2, y2, color: "ink", width: 2, ...o }); }
  pt(x, y, o = {}) { return this.add({ t: "pt", x, y, color: "ink", r: 6, ...o }); }
  text(x, y, s, o = {}) { return this.add({ t: "text", x, y, s, color: "ink", size: 14, align: "center", base: "middle", dx: 0, dy: 0, ...o }); }
  band(x1, x2, y1, y2, o = {}) { return this.add({ t: "band", x1, x2, y1, y2, color: "gold", alpha: .18, ...o }); }
  col(name) { return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim() || name; }
  draw() {
    const cv = this.cv, dpr = window.devicePixelRatio || 1, w = cv.clientWidth, hgt = cv.clientHeight;
    if (!w || !hgt) return;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
    const c = this.ctx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, hgt);
    const [x0, x1, y0, y1] = this.view, log = !!this.opts.ylog;
    const pad = { l: log ? 54 : 44, r: 14, t: 12, b: 34 };
    const ty = v => (log ? Math.log10(v) : v);
    const X = x => pad.l + (x - x0) / (x1 - x0) * (w - pad.l - pad.r);
    const Y = y => pad.t + (ty(y1) - ty(y)) / (ty(y1) - ty(y0)) * (hgt - pad.t - pad.b);
    this.X = X; this.Y = Y;
    const font = sz => `${sz}px ${this.col("body") || "sans-serif"}`;
    // grid + ticks
    c.lineWidth = 1; c.strokeStyle = this.col("line"); c.fillStyle = this.col("muted"); c.font = font(12);
    const xt = this.opts.xticks || ticks(x0, x1, 6);
    c.textAlign = "center"; c.textBaseline = "top";
    for (const v of xt) { c.beginPath(); c.moveTo(X(v), pad.t); c.lineTo(X(v), hgt - pad.b); c.stroke(); c.fillText(fmtTick(v), X(v), hgt - pad.b + 6); }
    const yt = log ? range(Math.ceil(Math.log10(y0)), Math.floor(Math.log10(y1))).map(k => 10 ** k) : (this.opts.yticks || ticks(y0, y1, 6));
    c.textAlign = "right"; c.textBaseline = "middle";
    for (const v of yt) { c.beginPath(); c.moveTo(pad.l, Y(v)); c.lineTo(w - pad.r, Y(v)); c.stroke();
      if (!this.opts.noY) c.fillText(log ? pow10(Math.round(Math.log10(v))) : fmtTick(v), pad.l - 6, Y(v)); }
    if (!log && y0 < 0 && y1 > 0) { c.strokeStyle = this.col("muted"); c.lineWidth = 1.5; c.beginPath(); c.moveTo(pad.l, Y(0)); c.lineTo(w - pad.r, Y(0)); c.stroke(); }
    if (this.opts.xlabel) { c.textAlign = "right"; c.textBaseline = "bottom"; c.fillStyle = this.col("muted"); c.fillText(this.opts.xlabel, w - pad.r, hgt - 2); }
    c.save(); c.beginPath(); c.rect(pad.l, pad.t, w - pad.l - pad.r, hgt - pad.t - pad.b); c.clip();
    for (const it of this.items) {
      const color = this.col(it.color);
      c.globalAlpha = it.alpha ?? 1; c.setLineDash(it.dash ? [6, 5] : []);
      if (it.t === "fn") {
        c.strokeStyle = color; c.lineWidth = it.width; c.beginPath(); let pen = false;
        const [a, b] = it.domain || [x0, x1];
        for (let i = 0; i <= 600; i++) { const x = a + (b - a) * i / 600, y = it.g(x);
          if (!isFinite(y) || (log && y <= 0)) { pen = false; continue; }
          const py = Y(y); if (py < -2000 || py > 4000) { pen = false; continue; }
          pen ? c.lineTo(X(x), py) : c.moveTo(X(x), py); pen = true; }
        c.stroke();
      } else if (it.t === "seg") {
        c.strokeStyle = color; c.lineWidth = it.width; c.lineCap = it.cap || "round";
        c.beginPath(); c.moveTo(X(it.x1), Y(it.y1)); c.lineTo(X(it.x2), Y(it.y2)); c.stroke();
      } else if (it.t === "pt") {
        c.beginPath(); c.arc(X(it.x), Y(it.y), it.r, 0, 2 * Math.PI);
        if (it.ring) { c.strokeStyle = color; c.lineWidth = 3; c.stroke(); } else { c.fillStyle = color; c.fill(); }
      } else if (it.t === "band") {
        c.fillStyle = color; c.fillRect(X(it.x1), Y(it.y2), X(it.x2) - X(it.x1), Y(it.y1) - Y(it.y2));
      } else if (it.t === "text") {
        c.fillStyle = color; c.font = (it.bold ? "600 " : "") + font(it.size); c.textAlign = it.align; c.textBaseline = it.base;
        c.fillText(it.s, X(it.x) + it.dx, Y(it.y) + it.dy);
      }
    }
    c.restore(); c.globalAlpha = 1; c.setLineDash([]);
  }
}
function ticks(a, b, n) {
  const raw = (b - a) / n, mag = 10 ** Math.floor(Math.log10(raw)), s = [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= raw);
  const out = []; for (let v = Math.ceil(a / s) * s; v <= b + 1e-9; v += s) out.push(+v.toFixed(10)); return out;
}
function range(a, b) { const r = []; for (let k = a; k <= b; k++) r.push(k); return r; }
function fmtTick(v) { return Math.abs(v) < 1e-12 ? "0" : String(+v.toPrecision(6)); }
function pow10(k) { const sup = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
  return "10" + String(k).split("").map(ch => sup[ch]).join(""); }

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); Object.assign(e, attrs); if (html) e.innerHTML = html; return e; };
const near = (v, t, tol = 1e-6) => Number.isFinite(v) && Math.abs(v - t) <= tol * Math.max(1, Math.abs(t));
const signCol = v => (v > 0 ? "pos" : "neg");
const signed = v => `<span class="${signCol(v)}">${v.toFixed(3)} (${v > 0 ? "positive" : v < 0 ? "negative" : "zero"})</span>`;
function parseNum(s) {
  s = String(s).trim().replace(/−/g, "-").replace(/,/g, ".");
  if (!s) return NaN;
  const n = Number(s); if (Number.isFinite(n)) return n;
  if (!/^[0-9+\-*/^().eE\s]+$/.test(s)) return NaN;           // arithmetic only, e.g. 1/32 or 2^-5
  try { const v = Function(`"use strict"; return (${s.replace(/\^/g, "**")});`)(); return Number.isFinite(v) ? v : NaN; }
  catch { return NaN; }
}
function field(parent, label, id, placeholder = "type a number") {
  const row = el("div", { className: "field" });
  row.append(el("label", { htmlFor: id }, label), el("input", { type: "text", id, placeholder, inputMode: "decimal", autocomplete: "off" }));
  parent.append(row); return row.querySelector("input");
}
function cards(parent, texts, question) {
  if (question) parent.append(el("div", { className: "question" }, question));
  const box = el("div", { className: "cards" }); parent.append(box);
  const btns = texts.map((t, i) => { const b = el("button", { type: "button", className: "card", id: `opt${i + 1}` }, t);
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => { S.choice = i + 1; btns.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }; box.append(b); return b; });
  return btns;
}
function slider(parent, label, id, min, max, step, value, oninput) {
  const row = el("div", { className: "slider" });
  const out = el("output", { htmlFor: id });
  const inp = el("input", { type: "range", id, min, max, step, value });
  inp.setAttribute("aria-label", label);
  const upd = () => { out.textContent = `${label} = ${(+inp.value).toFixed(step < 1 ? 2 : 0)}`; oninput(+inp.value); };
  inp.oninput = upd; row.append(out, inp); parent.append(row); setTimeout(upd); return inp;
}
function drawBracket(a, b, title) {
  P.setView(0.9, 2.1, -3, 5, { xlabel: "x" });
  P.fn(f); P.seg(a, 0, b, 0, { color: "gold", width: 8, cap: "butt" });
  for (const x of [a, b]) { P.seg(x, 0, x, f(x), { color: signCol(f(x)), dash: true, width: 1.5 }); P.pt(x, f(x), { color: signCol(f(x)) }); }
  if (b - a > 0.05) { P.text(a, 0, "a", { dy: 16, bold: true, size: 15 }); P.text(b, 0, "b", { dy: 16, bold: true, size: 15 }); }
  $("plotTitle").textContent = title; P.draw();
}

/* ---------------- tasks ---------------- */
const LECTURE_NAME = "Lecture 2";
const secNext = (a, b, g = f) => b - g(b) * (b - a) / (g(b) - g(a));
function secSeq(x0, x1, n) { const xs = [x0, x1]; for (let k = 0; k < n; k++) { const a = xs.at(-2), b = xs.at(-1); if (f(a) === f(b)) break; xs.push(secNext(a, b)); } return xs; }
const XS = secSeq(0, 1, 7);                       // x0 .. x8 of the worked example

/** Draw f, the secant through x_a and x_b (extended across the view), and its crossing. */
function drawSecant(xa, xb, view, title, o = {}) {
  const [v0, v1, w0, w1] = view;
  P.setView(v0, v1, w0, w1, { xlabel: "x" }); P.fn(f);
  const m = (f(xb) - f(xa)) / (xb - xa);
  if (Number.isFinite(m)) P.seg(v0, f(xa) + m * (v0 - xa), v1, f(xa) + m * (v1 - xa), { color: o.lineColor || "gold", width: 2.5 });
  for (const [x, n] of [[xa, o.la], [xb, o.lb]]) {
    P.seg(x, 0, x, f(x), { color: signCol(f(x)), dash: true, width: 1.5 }); P.pt(x, f(x), { color: signCol(f(x)), r: 7 });
    if (n) P.text(x, 0, n, { dy: f(x) > 0 ? 16 : -16, size: 15, bold: true });
  }
  if (o.showNext && Number.isFinite(m) && m !== 0) { const xn = secNext(xa, xb); P.pt(xn, 0, { color: "ink", r: 6 }); if (o.ln) P.text(xn, 0, o.ln, { dy: 18, size: 15, bold: true }); }
  if (o.root) P.pt(ROOT, 0, { color: "pos", r: 5, ring: true });
  $("plotTitle").textContent = title; P.draw();
}
function finalPlot() {
  drawSecant(XS[6], XS[7], [0.7, 0.9, -0.4, 0.4], `r ≈ ${ROOT.toFixed(7)}`, { root: true });
  P.pt(ROOT, 0, { color: "gold", r: 9 }); P.draw();
}

const TASKS = [
  { nav: "Slope of the secant", title: "The slope of the secant",
    instr: `<p>We solve <span class="math">f(x) = x³ + 2x² − x − 1 = 0</span> starting from <b>x₀ = 0</b> and <b>x₁ = 1</b>.</p>
            <p>f(0) = −1 and f(1) = 1. What is the <b>slope</b> of the secant line through these two points?</p>`,
    hints: ["Slope = rise over run = (f(x₁) − f(x₀)) / (x₁ − x₀).", "(1 − (−1)) / (1 − 0)."],
    answer: "slope = (1 − (−1)) / (1 − 0) = 2.",
    build(C) {
      drawSecant(0, 1, [-0.3, 1.3, -1.6, 2.2], "The secant through (0, −1) and (1, 1)", { la: "x₀", lb: "x₁" });
      const s = field(C, "slope =", "ans1");
      return () => {
        const v = parseNum(s.value);
        if (near(v, 0.5)) return ["wrong", "That is run over rise. The slope is rise over run."];
        if (!near(v, 2)) return ["wrong", "Not quite. Divide the change in f by the change in x."];
        return ["done", "Correct! The secant rises 2 units in f for every unit in x."];
      };
    } },

  { nav: "Next guess x₂", title: "Where does the line cross?",
    instr: `<p>From x₁ = 1 we slide down the secant to the axis. We must drop a height of f(x₁) = 1, so we move left by f(x₁) / slope.</p>
            <p>Use <span class="math">x₂ = x₁ − f(x₁)(x₁ − x₀) / (f(x₁) − f(x₀))</span> to find <b>x₂</b>.</p>`,
    hints: ["f(x₁)(x₁ − x₀) = 1 × 1 and f(x₁) − f(x₀) = 2.", "x₂ = 1 − 1/2."],
    answer: "x₂ = 1 − 1·(1 − 0)/(1 − (−1)) = 0.5.",
    build(C) {
      drawSecant(0, 1, [-0.3, 1.3, -1.6, 2.2], "Slide down the secant to the axis", { la: "x₀", lb: "x₁" });
      const s = field(C, "x₂ =", "ans1");
      return () => {
        if (!near(parseNum(s.value), 0.5)) return ["wrong", "Not quite. Put x₀ = 0, x₁ = 1, f(x₀) = −1, f(x₁) = 1 into the formula."];
        drawSecant(0, 1, [-0.3, 1.3, -1.6, 2.2], "x₂ = 0.5", { la: "x₀", lb: "x₁", showNext: true, ln: "x₂" });
        return ["done", "Correct! The secant crosses the axis at x₂ = 0.5, where f = −0.875."];
      };
    } },

  { nav: "Drag the points", title: "Drag the two points",
    instr: `<p>Move the sliders to choose x₀ and x₁. The gold line is the secant and the black dot is the next guess x₂.</p>
            <p>Your goal: make <b>x₂ land within 0.02 of the root</b> r ≈ 0.802 (the green ring).</p>`,
    hints: ["Points far apart give a rough line. What happens when both points are near the root?", "Try x₀ and x₁ both between 0.6 and 1.0."],
    answer: "Any two points close to the root work, for example x₀ = 0.7 and x₁ = 0.9.",
    build(C) {
      let a = 0, b = 1.3; const live = el("div", { className: "live" });
      const redraw = () => {
        drawSecant(a, b, [-0.4, 1.4, -1.6, 2.4], "Move x₀ and x₁", { la: "x₀", lb: "x₁", showNext: true, ln: "x₂", root: true });
        const x2 = secNext(a, b);
        live.innerHTML = Number.isFinite(x2) && a !== b
          ? `x₂ = ${x2.toFixed(4)} &nbsp; distance to root = <span class="${Math.abs(x2 - ROOT) < 0.02 ? "pos" : "neg"}">${Math.abs(x2 - ROOT).toFixed(4)}</span>`
          : `<span class="neg">x₀ and x₁ must be different points.</span>`;
      };
      slider(C, "x₀", "sa", -0.4, 1.4, 0.01, 0, v => { a = v; redraw(); });
      slider(C, "x₁", "sb", -0.4, 1.4, 0.01, 1.3, v => { b = v; redraw(); });
      C.append(live);
      return () => {
        if (a === b) return ["wrong", "x₀ and x₁ must be different."];
        const x2 = secNext(a, b);
        if (!(Math.abs(x2 - ROOT) < 0.02)) return ["wrong", `x₂ = ${x2.toFixed(3)} is ${Math.abs(x2 - ROOT).toFixed(3)} away from the root. Keep trying.`];
        return ["done", `x₂ = ${x2.toFixed(4)} is within 0.02 of the root. Starting points close to the root give an excellent next guess.`];
      };
    } },

  { nav: "Secant by hand", title: "Secant by hand",
    instr: `<p>Continue the example. Each step uses the <b>two newest</b> points:</p>
            <p><span class="math">xₙ₊₁ = xₙ − f(xₙ)(xₙ − xₙ₋₁) / (f(xₙ) − f(xₙ₋₁))</span></p>`,
    hints: ["Keep x₁ = 1 and x₂ = 0.5 for the first step; x₀ is no longer used.", "Watch the signs: f(x₂) is negative.",
            "4 decimal places is enough."],
    answer: "",
    build(C, T) {
      let step = 0;
      const lbl = el("div", { className: "steplabel" }), info = el("div", { className: "live" });
      C.append(lbl, info);
      const inp = field(C, "", "ans1");
      const lab = inp.parentElement.querySelector("label");
      const setup = () => {
        const n = step + 3, a = XS[n - 2], b = XS[n - 1];
        lbl.textContent = `Step ${step + 1} of 2: compute x${"₃₄"[step]}`;
        lab.textContent = `x${"₃₄"[step]} =`; inp.value = "";
        info.innerHTML = `x${"₁₂"[step]} = ${+a.toFixed(4)}, f = ${f(a).toFixed(4)}<br>x${"₂₃"[step]} = ${+b.toFixed(4)}, f = ${f(b).toFixed(4)}`;
        drawSecant(a, b, [-0.2, 1.2, -1.4, 1.6], `Step ${step + 1}: secant through x${"₁₂"[step]} and x${"₂₃"[step]}`,
          { la: `x${"₁₂"[step]}`, lb: `x${"₂₃"[step]}` });
        T.answer = `x${"₃₄"[step]} = ${XS[n].toFixed(6)}`;
      };
      setup();
      return () => {
        const n = step + 3;
        if (!(Math.abs(parseNum(inp.value) - XS[n]) <= 5e-4)) return ["wrong", "Not quite. Check the signs in the formula carefully."];
        if (step === 0) { step = 1; setTimeout(setup, 350); return ["step", `Correct! x₃ = ${XS[3].toFixed(4)}. Now drop x₁ and use x₂ and x₃.`]; }
        drawSecant(XS[2], XS[3], [-0.2, 1.2, -1.4, 1.6], "x₄ overshoots the root slightly", { la: "x₂", lb: "x₃", showNext: true, ln: "x₄", root: true });
        let rows = "";
        for (let k = 0; k <= 8; k++) rows += `<tr><td>${k}</td><td class="gold">${XS[k].toFixed(7)}</td><td class="${signCol(f(XS[k]))}">${f(XS[k]) >= 0 ? "+" : ""}${f(XS[k]).toFixed(6)}</td><td>${Math.abs(XS[k] - ROOT).toExponential(1)}</td></tr>`;
        C.innerHTML = `<div class="question">The whole run, computed for you:</div><div class="tablewrap"><table class="iter"><thead><tr><th>n</th><th>xₙ</th><th>f(xₙ)</th><th>|xₙ − r|</th></tr></thead><tbody>${rows}</tbody></table></div>`;
        return ["done", `Excellent! x₄ = ${XS[4].toFixed(4)}. By x₈ the error is below 10⁻¹⁰.`];
      };
    } },

  { nav: "No bracket", title: "Both points on one side",
    instr: `<p>In the example, <b>x₂ = 0.5</b> and <b>x₃ ≈ 0.733</b> both have f &lt; 0: both points are below the axis.</p>
            <p>What does the secant method do next?</p>`,
    hints: ["Look at the gold line in the plot. Does it stop at the two points?", "A straight line can be extended as far as we like."],
    answer: "It extends the line beyond both points (extrapolation) and uses the crossing x₄ ≈ 0.834.",
    build(C) {
      drawSecant(XS[2], XS[3], [0.3, 1.0, -1.2, 0.6], "Two points below the axis", { la: "x₂", lb: "x₃", root: true });
      cards(C, ["It stops: there is no sign change", "It extends the line beyond the points and uses its crossing", "It switches to bisection automatically"]);
      return () => {
        if (!S.choice) return ["wrong", "Choose one of the options."];
        if (S.choice === 1) return ["wrong", "Bisection would need a sign change, but the secant method does not."];
        if (S.choice === 3) return ["wrong", "The plain secant method never switches. (Some hybrid methods, like MATLAB's fzero, do.)"];
        drawSecant(XS[2], XS[3], [0.3, 1.0, -1.2, 0.6], "Extrapolation: x₄ ≈ 0.834", { la: "x₂", lb: "x₃", showNext: true, ln: "x₄", root: true });
        return ["done", "Right! The secant method never keeps a bracket. It simply extends the line."];
      };
    } },

  { nav: "Correct digits", title: "Digits add up",
    instr: `<p>For the secant method <span class="math">eₙ₊₁ ≈ C·eₙ·eₙ₋₁</span>. Multiplying errors <b>adds</b> their numbers of correct digits.</p>
            <p>In the example x₄, x₅, x₆ have about <b>1.5, 2.6 and 4.1</b> correct digits. Predict the digits of <b>x₇</b>.</p>`,
    hints: ["The next number of digits is roughly the sum of the last two.", "2.6 + 4.1 = ?"],
    answer: "About 2.6 + 4.1 = 6.7 digits. The actual value is 6.69.",
    build(C) {
      const d = [1.50, 2.62, 4.10, 6.69, 10.76];
      const draw = k => {
        P.setView(0.4, 5.6, 0, 12, { xlabel: "guess", xticks: [1, 2, 3, 4, 5], yticks: [0, 2, 4, 6, 8, 10, 12] });
        for (let i = 0; i < k; i++) { P.seg(i + 1, 0, i + 1, d[i], { color: i < 3 ? "curve" : "pos", width: 26, cap: "butt" });
          P.text(i + 1, d[i], d[i].toFixed(1), { dy: -12, bold: true }); }
        for (let i = 0; i < 5; i++) P.text(i + 1, 0, `x${"₄₅₆₇₈"[i]}`, { dy: -12, color: "muted", size: 12 });
        $("plotTitle").textContent = "Correct digits in each guess"; P.draw();
      };
      draw(3);
      const inp = field(C, "digits of x₇ ≈", "ans1");
      return () => {
        const v = parseNum(inp.value);
        if (!Number.isFinite(v)) return ["wrong", "Type a number of digits, for example 5.2."];
        if (Math.abs(v - 6.7) > 0.35) return ["wrong", "Not quite. Add the digits of the previous two guesses."];
        draw(5);
        return ["done", "Correct! 2.6 + 4.1 ≈ 6.7, and then 4.1 + 6.7 ≈ 10.8. The digits grow like Fibonacci numbers."];
      };
    } },

  { nav: "Order of convergence", title: "The order of convergence",
    instr: `<p>If eₙ₊₁ ≈ C·eₙᵖ, then p is the order of convergence. The plot races bisection against secant on the same problem.</p>
            <p>What is the order <b>p</b> of the secant method?</p>`,
    hints: ["The digits grow like Fibonacci numbers, and the ratio of consecutive Fibonacci numbers tends to a famous constant.",
            "p is the positive solution of p² = p + 1."],
    answer: "p = (1 + √5)/2 ≈ 1.618, the golden ratio.",
    build(C) {
      P.setView(0, 12, 1e-12, 2, { xlabel: "step", ylog: true, xticks: [0, 2, 4, 6, 8, 10, 12] });
      let a = 0, b = 1, prev = null;
      for (let n = 1; n <= 12; n++) { const c = (a + b) / 2, e = Math.abs(c - ROOT);
        if (prev) P.seg(prev[0], prev[1], n, e, { color: "neg", width: 2 }); P.pt(n, e, { color: "neg", r: 4 }); prev = [n, e];
        if (f(a) * f(c) < 0) b = c; else a = c; }
      prev = null;
      for (let n = 1; n <= 7; n++) { const e = Math.abs(XS[n + 1] - ROOT);
        if (prev) P.seg(prev[0], prev[1], n, e, { color: "pos", width: 2.5 }); P.pt(n, e, { color: "pos", r: 5 }); prev = [n, e]; }
      P.text(11.8, 5e-4, "bisection", { color: "neg", align: "right", bold: true });
      P.text(7.3, 2e-11, "secant", { color: "pos", align: "left", bold: true });
      $("plotTitle").textContent = "Error per step (log scale)"; P.draw();
      cards(C, ["p = 1 (linear)", "p ≈ 1.618", "p = 2 (quadratic)", "p = 0.5"]);
      return () => {
        if (!S.choice) return ["wrong", "Choose one of the options."];
        if (S.choice === 1) return ["wrong", "That is bisection. The secant method is faster than linear."];
        if (S.choice === 3) return ["wrong", "Close, but not quite quadratic: the digits don't double each step."];
        if (S.choice === 4) return ["wrong", "An order below 1 would mean it doesn't converge."];
        return ["done", "Right! p = (1 + √5)/2 ≈ 1.618, the golden ratio: superlinear convergence."];
      };
    } },

  { nav: "When it fails", title: "When the secant method fails",
    instr: `<p>Click each pair of starting points to see its first secant step.</p>
            <p>Which pair makes the next guess <b>jump far away</b> from every root?</p>`,
    hints: ["Look for two points where the curve is almost flat.", "When f(x₀) ≈ f(x₁) the secant is nearly horizontal."],
    answer: "x₀ = 0.2, x₁ = 0.3. The curve is almost flat there, so the secant is nearly horizontal and crosses the axis at x₂ ≈ 6.05.",
    build(C) {
      const pairs = [[0, 1], [0.2, 0.3], [0.7, 0.9], [-1.5, -1]];
      const view = [-2.6, 6.5, -2, 4];
      drawSecant(0, 1, view, "Pick a pair", {});
      const btns = cards(C, pairs.map(([p, q]) => `x₀ = ${p},  x₁ = ${q}`));
      btns.forEach((b, i) => b.addEventListener("click", () => {
        const [p, q] = pairs[i];
        drawSecant(p, q, view, `x₀ = ${p}, x₁ = ${q}  →  x₂ = ${secNext(p, q).toFixed(3)}`, { showNext: true, ln: "x₂" });
      }));
      return () => {
        if (!S.choice) return ["wrong", "Choose one of the pairs."];
        if (S.choice !== 2) return ["wrong", "That first step stays close to a root. Try another pair."];
        return ["done", "Right! f(0.2) ≈ f(0.3), so the secant is nearly horizontal and x₂ ≈ 6.05. If the values were equal, we would divide by zero."];
      };
    } },

  { nav: "The algorithm", title: "Put the algorithm in order",
    instr: `<p>Put the steps of the secant method in the right order using the menus.</p><p>When it is right, the plot runs the algorithm for you.</p>`,
    hints: ["You need two starting guesses first, and you must check the denominator before dividing.", "Compute x₂, then shift the points and test for convergence."],
    answer: "1. Choose two starting guesses x₀ and x₁<br>2. If f(x₁) = f(x₀), stop: zero denominator<br>3. Compute x₂ = x₁ − f(x₁)(x₁ − x₀)/(f(x₁) − f(x₀))<br>4. Shift x₀ ← x₁, x₁ ← x₂; stop if |x₁ − x₀| &lt; tol, else repeat",
    build(C) {
      const steps = ["Choose two starting guesses x₀ and x₁", "If f(x₁) = f(x₀), stop: zero denominator",
                     "Compute x₂ = x₁ − f(x₁)(x₁ − x₀)/(f(x₁) − f(x₀))", "Shift x₀ ← x₁, x₁ ← x₂; stop if |x₁ − x₀| < tol, else repeat"];
      const order = [2, 3, 0, 1];
      const grid = el("div", { className: "order" }); C.append(grid);
      const sels = [0, 1, 2, 3].map(k => {
        const s = el("select", { id: `dd${k + 1}` });
        s.append(el("option", { value: "" }, "— choose —"), ...order.map(i => { const o = el("option", { value: i }); o.textContent = steps[i]; return o; }));
        grid.append(el("label", { htmlFor: `dd${k + 1}`, className: "steplabel" }, `Step ${k + 1}`), s); return s; });
      drawSecant(0, 1, [-0.2, 1.2, -1.4, 1.6], "f(x) = x³ + 2x² − x − 1", { la: "x₀", lb: "x₁" });
      return () => {
        const v = sels.map(s => s.value);
        if (v.includes("")) return ["wrong", "Choose an option for every step."];
        if (new Set(v).size < 4) return ["wrong", "Each option should be used exactly once."];
        const bad = v.findIndex((x, k) => +x !== k);
        if (bad >= 0) return ["wrong", `Step ${bad + 1} is not in the right place yet.`];
        let n = 1;
        const tick = () => { drawSecant(XS[n - 1], XS[n], [-0.2, 1.2, -1.4, 1.6], `Iteration ${n}: x${n + 1} = ${XS[n + 1].toFixed(7)}`,
          { showNext: true, root: true }); if (++n < 7) setTimeout(tick, 650); };
        setTimeout(tick, 300);
        return ["done", "Perfect order! Watch the secant lines close in on the root."];
      };
    } },
];

/* ---------------- engine ---------------- */
const P = new Plot($("cv"));
const S = { cur: 0, status: TASKS.map(() => 0), attempts: 0, hintIdx: 0, hintUsed: false, choice: 0, check: null, task: null };
// status: 0 = not done, 1 = solved without help, 2 = solved with help, 3 = answer shown
try { const saved = JSON.parse(localStorage.getItem(STORE) || "null"); if (saved && saved.status?.length === TASKS.length) { S.status = saved.status; S.cur = saved.cur || 0; } } catch {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ status: S.status, cur: S.cur })); } catch {} };

function feedback(kind, msg) {
  const fb = $("feedback"); fb.className = "feedback " + (kind || "");
  fb.innerHTML = !kind ? "" : kind === "ok" ? "✓ " + msg : kind === "bad" ? "✗ " + msg : kind === "hint" ? "<b>Hint:</b> " + msg : msg;
}
function chrome() {
  const segs = $("segs"), nav = $("nav"); segs.innerHTML = ""; nav.innerHTML = "";
  nav.append(el("div", { className: "nav-label" }, "Tasks"));
  TASKS.forEach((t, i) => {
    const s = S.status[i], cls = s === 1 || s === 2 ? "done" : s === 3 ? "shown" : "";
    segs.append(el("div", { className: `seg ${cls || (i === S.cur ? "cur" : "")}` }));
    const b = el("button", { type: "button", className: `nav-item ${cls} ${i === S.cur ? "cur" : ""}` },
      `<span class="mark">${["○", "★", "✓", "!"][s]}</span><span>${i + 1}. ${t.nav}</span>`);
    if (i === S.cur) b.setAttribute("aria-current", "step");
    b.onclick = () => show(i); nav.append(b);
  });
  const n = st => S.status.filter(x => x === st).length;
  nav.append(el("div", { className: "tally" }, `<span>★ ${n(1)} solved first time</span><span>✓ ${n(2)} solved with help</span><span>! ${n(3)} answers shown</span>`));
  $("count").textContent = `${S.status.filter(x => x > 0).length} / ${TASKS.length} done`;
  $("nextBtn").textContent = S.cur === TASKS.length - 1 ? "Finish →" : S.status[S.cur] ? "Next →" : "Skip →";
}
function show(i) {
  S.cur = i; S.attempts = 0; S.hintIdx = 0; S.hintUsed = false; S.choice = 0; save();
  const t = S.task = { ...TASKS[i] };
  $("eyebrow").textContent = `Task ${i + 1} of ${TASKS.length}`; $("title").textContent = t.title; $("instr").innerHTML = t.instr;
  const C = $("controls"); C.innerHTML = ""; feedback("", "");
  ["hintBtn", "revealBtn", "checkBtn"].forEach(id => { $(id).hidden = false; }); $("checkBtn").disabled = false;
  S.check = t.build(C, t); chrome();
}
function onCheck() {
  const [res, msg] = S.check();
  if (res === "done") { if (!S.status[S.cur]) S.status[S.cur] = S.attempts || S.hintUsed ? 2 : 1; feedback("ok", msg); $("checkBtn").disabled = true; save(); }
  else if (res === "step") feedback("ok", msg);
  else { S.attempts++; feedback("bad", msg + (S.attempts >= 2 && S.hintIdx < S.task.hints.length ? " Stuck? Try the <b>Hint</b> button." : "")); }
  chrome();
}
function onHint() { S.hintUsed = true; S.hintIdx = Math.min(S.hintIdx + 1, S.task.hints.length); feedback("hint", S.task.hints[S.hintIdx - 1]); }
function onReveal() { if (!S.status[S.cur]) S.status[S.cur] = 3; save(); feedback("info", "<b>Answer:</b> " + S.task.answer); chrome(); }
function onNext() { if (S.cur < TASKS.length - 1) show(S.cur + 1); else summary(); }
function summary() {
  const solved = S.status.filter(x => x === 1 || x === 2).length, stars = S.status.filter(x => x === 1).length;
  $("eyebrow").textContent = "Complete"; $("title").textContent = `${LECTURE_NAME} complete!`;
  $("instr").innerHTML = `<p>You solved <b>${solved} of ${TASKS.length}</b> tasks, <b>${stars}</b> of them first time.</p>
    <p>Tasks marked ! or ○ are worth another look: rewatch that part of the video, then pick the task on the left to try again.</p>`;
  const labels = ["not done", "★ first time", "✓ with help", "! answer shown"];
  $("controls").innerHTML = `<div class="tablewrap"><table class="iter"><thead><tr><th style="text-align:left">Task</th><th style="text-align:left">Result</th></tr></thead><tbody>${
    TASKS.map((t, i) => `<tr><td style="text-align:left">${i + 1}. ${t.title}</td><td style="text-align:left">${labels[S.status[i]]}</td></tr>`).join("")}</tbody></table></div>`;
  feedback("ok", `Well done! Score: ${solved} / ${TASKS.length}`);
  ["hintBtn", "revealBtn", "checkBtn"].forEach(id => { $(id).hidden = true; });
  $("nextBtn").textContent = "Start over";
  $("nextBtn").onclick = () => { S.status = TASKS.map(() => 0); $("nextBtn").onclick = onNext; show(0); };
  finalPlot();
}
$("checkBtn").onclick = onCheck; $("hintBtn").onclick = onHint; $("revealBtn").onclick = onReveal; $("nextBtn").onclick = onNext;
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input[type=text]") && !$("checkBtn").disabled) onCheck(); });
show(S.cur);
</script>
</body></html>
