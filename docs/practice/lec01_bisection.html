<style>
/* Layout: course bar on top; task list | task card | live plot. Stacks to one column on phones. */

  --bg: #f4f6fa; --surface: #ffffff; --ink: #1b2233; --muted: #5a6477; --line: #dde2ea;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --accent: #8ab4f8; --accent-ink: #0f1117; --accent-soft: #1d2940;
  --gold: #fdd663; --pos: #81c995; --neg: #f28b82; --curve: #8ab4f8;
  --ok-bg: #16281e; --bad-bg: #2e1a19; --hint-bg: #18223a; --bar: #0b0e14; --bar-ink: #e8eaed; --track: #2d3547;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #171b24; --ink: #e8eaed; --muted: #9aa3b5; --line: #2a3142;
  --accent: #8ab4f8; --accent-ink: #0f1117; --accent-soft: #1d2940;
  --gold: #fdd663; --pos: #81c995; --neg: #f28b82; --curve: #8ab4f8;
  --ok-bg: #16281e; --bad-bg: #2e1a19; --hint-bg: #18223a; --bar: #0b0e14; --bar-ink: #e8eaed; --track: #2d3547;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--body); margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { background: var(--bar); color: var(--bar-ink); padding: 14px 16px; }
.topbar-inner { max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }

  display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }

.instr { max-width: 62ch; }

.controls { display: flex; flex-direction: column; gap: 14px; }

.field label { min-width: 120px; color: var(--muted); }
.field input[type=text] { width: 160px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
  font-family: var(--mono); font-size: 15px; }

.cards { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

.card:hover { border-color: var(--accent); }
.card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.slider { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; }
.slider output { font-family: var(--mono); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.live { font-family: var(--mono); font-size: 14px; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .gold { color: var(--gold); }
select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.order { display: grid; grid-template-columns: 64px 1fr; gap: 8px 10px; align-items: center; }
.steplabel { font-weight: 600; color: var(--accent); }

table.iter th, table.iter td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); }

.tablewrap { overflow-x: auto; }

.feedback { border-radius: 8px; padding: 12px 14px; min-height: 48px; }

.feedback.ok { background: var(--ok-bg); color: var(--pos); }
.feedback.bad { background: var(--bad-bg); color: var(--neg); }

.btn:hover { border-color: var(--accent); }

.btn:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }

.plot { grid-area: plot; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0;
  position: sticky; top: 16px; }
.plot-title { font-weight: 600; font-size: 14px; margin: 2px 4px 8px; }
canvas { width: 100%; height: auto; aspect-ratio: 4 / 3.3; display: block; max-width: 100%; }

@media (max-width: 1080px) {
  .wrap { grid-template-columns: 200px minmax(0, 1fr); grid-template-areas: "nav plot" "nav task"; }
}
@media (max-width: 720px) {
  .wrap { grid-template-columns: minmax(0, 1fr); grid-template-areas: "nav" "plot" "task"; gap: 14px; }
  nav.tasks { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .nav-label, .tally { display: none; }
  .nav-item { grid-template-columns: 18px auto; white-space: nowrap; flex: none; }
  .plot { position: static; }
  .progress { margin-left: 0; }

}

<header class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="course"><a href="../">Numerical Methods</a> · Practice</div>

    </div>

      <div class="segs" id="segs"></div>

    </div>

</header>

<main class="wrap">
  <nav class="tasks" id="nav" aria-label="Tasks"></nav>
  <section class="plot" aria-label="Plot">
    <div class="plot-title" id="plotTitle"></div>
    <canvas id="cv" width="800" height="660"></canvas>
  </section>
  <section class="task" aria-live="polite">
    <div>
      <div class="eyebrow" id="eyebrow">Task 1 of 9</div>
      <h1 id="title"></h1>
    </div>

    <div class="controls" id="controls"></div>
    <div class="feedback" id="feedback" role="status"></div>
    <div class="buttons" id="buttons">
      <button class="btn" id="hintBtn" type="button">Hint</button>
      <button class="btn" id="revealBtn" type="button">Show answer</button>
      <span class="spacer"></span>

      <button class="btn" id="nextBtn" type="button">Skip →</button>
    </div>

</main>

<script>
"use strict";
const STORE = "nm-lec01-bisection-v1";
const f = x => x ** 3 - x - 2;
const ROOT = 1.5213797068045676;

/* ---------------- tiny plotting library (canvas, theme-aware) ---------------- */
class Plot {
  constructor(canvas) {
    this.cv = canvas; this.ctx = canvas.getContext("2d"); this.items = []; this.view = [0, 1, 0, 1]; this.opts = {};
    new ResizeObserver(() => this.draw()).observe(canvas);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => this.draw());
    new MutationObserver(() => this.draw()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }
  setView(x0, x1, y0, y1, opts = {}) { this.view = [x0, x1, y0, y1]; this.opts = opts; this.items = []; }
  add(item) { this.items.push(item); return item; }
  fn(g, o = {}) { return this.add({ t: "fn", g, color: "curve", width: 3, ...o }); }
  seg(x1, y1, x2, y2, o = {}) { return this.add({ t: "seg", x1, y1, x2, y2, color: "ink", width: 2, ...o }); }
  pt(x, y, o = {}) { return this.add({ t: "pt", x, y, color: "ink", r: 6, ...o }); }
  text(x, y, s, o = {}) { return this.add({ t: "text", x, y, s, color: "ink", size: 14, align: "center", base: "middle", dx: 0, dy: 0, ...o }); }
  band(x1, x2, y1, y2, o = {}) { return this.add({ t: "band", x1, x2, y1, y2, color: "gold", alpha: .18, ...o }); }
  col(name) { return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim() || name; }
  draw() {
    const cv = this.cv, dpr = window.devicePixelRatio || 1, w = cv.clientWidth, hgt = cv.clientHeight;
    if (!w || !hgt) return;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
    const c = this.ctx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, hgt);
    const [x0, x1, y0, y1] = this.view, log = !!this.opts.ylog;
    const pad = { l: log ? 54 : 44, r: 14, t: 12, b: 34 };
    const ty = v => (log ? Math.log10(v) : v);
    const X = x => pad.l + (x - x0) / (x1 - x0) * (w - pad.l - pad.r);
    const Y = y => pad.t + (ty(y1) - ty(y)) / (ty(y1) - ty(y0)) * (hgt - pad.t - pad.b);
    this.X = X; this.Y = Y;
    const font = sz => `${sz}px ${this.col("body") || "sans-serif"}`;
    // grid + ticks
    c.lineWidth = 1; c.strokeStyle = this.col("line"); c.fillStyle = this.col("muted"); c.font = font(12);
    const xt = this.opts.xticks || ticks(x0, x1, 6);
    c.textAlign = "center"; c.textBaseline = "top";
    for (const v of xt) { c.beginPath(); c.moveTo(X(v), pad.t); c.lineTo(X(v), hgt - pad.b); c.stroke(); c.fillText(fmtTick(v), X(v), hgt - pad.b + 6); }
    const yt = log ? range(Math.ceil(Math.log10(y0)), Math.floor(Math.log10(y1))).map(k => 10 ** k) : (this.opts.yticks || ticks(y0, y1, 6));
    c.textAlign = "right"; c.textBaseline = "middle";
    for (const v of yt) { c.beginPath(); c.moveTo(pad.l, Y(v)); c.lineTo(w - pad.r, Y(v)); c.stroke();
      if (!this.opts.noY) c.fillText(log ? pow10(Math.round(Math.log10(v))) : fmtTick(v), pad.l - 6, Y(v)); }
    if (!log && y0 < 0 && y1 > 0) { c.strokeStyle = this.col("muted"); c.lineWidth = 1.5; c.beginPath(); c.moveTo(pad.l, Y(0)); c.lineTo(w - pad.r, Y(0)); c.stroke(); }
    if (this.opts.xlabel) { c.textAlign = "right"; c.textBaseline = "bottom"; c.fillStyle = this.col("muted"); c.fillText(this.opts.xlabel, w - pad.r, hgt - 2); }
    c.save(); c.beginPath(); c.rect(pad.l, pad.t, w - pad.l - pad.r, hgt - pad.t - pad.b); c.clip();
    for (const it of this.items) {
      const color = this.col(it.color);
      c.globalAlpha = it.alpha ?? 1; c.setLineDash(it.dash ? [6, 5] : []);
      if (it.t === "fn") {
        c.strokeStyle = color; c.lineWidth = it.width; c.beginPath(); let pen = false;
        const [a, b] = it.domain || [x0, x1];
        for (let i = 0; i <= 600; i++) { const x = a + (b - a) * i / 600, y = it.g(x);
          if (!isFinite(y) || (log && y <= 0)) { pen = false; continue; }
          const py = Y(y); if (py < -2000 || py > 4000) { pen = false; continue; }
          pen ? c.lineTo(X(x), py) : c.moveTo(X(x), py); pen = true; }
        c.stroke();
      } else if (it.t === "seg") {
        c.strokeStyle = color; c.lineWidth = it.width; c.lineCap = it.cap || "round";
        c.beginPath(); c.moveTo(X(it.x1), Y(it.y1)); c.lineTo(X(it.x2), Y(it.y2)); c.stroke();
      } else if (it.t === "pt") {
        c.beginPath(); c.arc(X(it.x), Y(it.y), it.r, 0, 2 * Math.PI);
        if (it.ring) { c.strokeStyle = color; c.lineWidth = 3; c.stroke(); } else { c.fillStyle = color; c.fill(); }
      } else if (it.t === "band") {
        c.fillStyle = color; c.fillRect(X(it.x1), Y(it.y2), X(it.x2) - X(it.x1), Y(it.y1) - Y(it.y2));
      } else if (it.t === "text") {
        c.fillStyle = color; c.font = (it.bold ? "600 " : "") + font(it.size); c.textAlign = it.align; c.textBaseline = it.base;
        c.fillText(it.s, X(it.x) + it.dx, Y(it.y) + it.dy);
      }
    }
    c.restore(); c.globalAlpha = 1; c.setLineDash([]);
  }
}
function ticks(a, b, n) {
  const raw = (b - a) / n, mag = 10 ** Math.floor(Math.log10(raw)), s = [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= raw);
  const out = []; for (let v = Math.ceil(a / s) * s; v <= b + 1e-9; v += s) out.push(+v.toFixed(10)); return out;
}
function range(a, b) { const r = []; for (let k = a; k <= b; k++) r.push(k); return r; }
function fmtTick(v) { return Math.abs(v) < 1e-12 ? "0" : String(+v.toPrecision(6)); }
function pow10(k) { const sup = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
  return "10" + String(k).split("").map(ch => sup[ch]).join(""); }

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); Object.assign(e, attrs); if (html) e.innerHTML = html; return e; };
const near = (v, t, tol = 1e-6) => Number.isFinite(v) && Math.abs(v - t) <= tol * Math.max(1, Math.abs(t));
const signCol = v => (v > 0 ? "pos" : "neg");
const signed = v => `<span class="${signCol(v)}">${v.toFixed(3)} (${v > 0 ? "positive" : v < 0 ? "negative" : "zero"})</span>`;
function parseNum(s) {
  s = String(s).trim().replace(/−/g, "-").replace(/,/g, ".");
  if (!s) return NaN;
  const n = Number(s); if (Number.isFinite(n)) return n;
  if (!/^[0-9+\-*/^().eE\s]+$/.test(s)) return NaN;           // arithmetic only, e.g. 1/32 or 2^-5
  try { const v = Function(`"use strict"; return (${s.replace(/\^/g, "**")});`)(); return Number.isFinite(v) ? v : NaN; }
  catch { return NaN; }
}
function field(parent, label, id, placeholder = "type a number") {
  const row = el("div", { className: "field" });
  row.append(el("label", { htmlFor: id }, label), el("input", { type: "text", id, placeholder, inputMode: "decimal", autocomplete: "off" }));
  parent.append(row); return row.querySelector("input");
}
function cards(parent, texts, question) {
  if (question) parent.append(el("div", { className: "question" }, question));
  const box = el("div", { className: "cards" }); parent.append(box);
  const btns = texts.map((t, i) => { const b = el("button", { type: "button", className: "card", id: `opt${i + 1}` }, t);
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => { S.choice = i + 1; btns.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }; box.append(b); return b; });
  return btns;
}
function slider(parent, label, id, min, max, step, value, oninput) {
  const row = el("div", { className: "slider" });
  const out = el("output", { htmlFor: id });
  const inp = el("input", { type: "range", id, min, max, step, value });
  inp.setAttribute("aria-label", label);
  const upd = () => { out.textContent = `${label} = ${(+inp.value).toFixed(step < 1 ? 2 : 0)}`; oninput(+inp.value); };
  inp.oninput = upd; row.append(out, inp); parent.append(row); setTimeout(upd); return inp;
}
function drawBracket(a, b, title) {
  P.setView(0.9, 2.1, -3, 5, { xlabel: "x" });
  P.fn(f); P.seg(a, 0, b, 0, { color: "gold", width: 8, cap: "butt" });
  for (const x of [a, b]) { P.seg(x, 0, x, f(x), { color: signCol(f(x)), dash: true, width: 1.5 }); P.pt(x, f(x), { color: signCol(f(x)) }); }
  if (b - a > 0.05) { P.text(a, 0, "a", { dy: 16, bold: true, size: 15 }); P.text(b, 0, "b", { dy: 16, bold: true, size: 15 }); }
  $("plotTitle").textContent = title; P.draw();
}

/* ---------------- tasks ---------------- */
const TASKS = [
  { nav: "Evaluate f", title: "Evaluate f at the endpoints",
    instr: `<p>We want to solve <span class="math">f(x) = x³ − x − 2 = 0</span>. A root is where the curve crosses the x-axis.</p>
            <p>Work out <b>f(1)</b> and <b>f(2)</b>, then decide whether f changes sign on [1, 2].</p>`,
    hints: ["Substitute x = 1:  1³ − 1 − 2.", "f(2) = 2³ − 2 − 2. One value is negative and one is positive."],
    answer: "f(1) = −2 and f(2) = 4. They have opposite signs, so yes: f changes sign on [1, 2].",
    build(C) {
      P.setView(-0.5, 2.5, -4, 6, { xlabel: "x" }); P.fn(f); $("plotTitle").textContent = "f(x) = x³ − x − 2"; P.draw();
      const a = field(C, "f(1) =", "ans1"), b = field(C, "f(2) =", "ans2");
      cards(C, ["Yes", "No"], "Does f change sign on [1, 2]?");
      return () => {
        if (!near(parseNum(a.value), -2)) return ["wrong", "f(1) is not right yet."];
        if (!near(parseNum(b.value), 4)) return ["wrong", "f(2) is not right yet."];
        if (!S.choice) return ["wrong", "Now choose Yes or No."];
        if (S.choice !== 1) return ["wrong", "Look at the signs of f(1) and f(2) again."];
        P.pt(1, -2, { color: "neg", r: 7 }); P.pt(2, 4, { color: "pos", r: 7 }); P.seg(1, 0, 2, 0, { color: "gold", width: 7, cap: "butt" }); P.draw();
        return ["done", "f(1) = −2 is negative and f(2) = 4 is positive, so the curve must cross the axis in between."];
      };
    } },

  { nav: "Starting interval", title: "Choose a starting interval",
    instr: `<p>Bisection needs a starting interval [a, b] where <b>f(a) and f(b) have opposite signs</b>, i.e. f(a)·f(b) &lt; 0.</p>
            <p>Drag the two sliders to choose your own a and b, then press <b>Check</b>.</p>`,
    hints: ["Watch the colours: red means f is negative, green means positive. You need one of each.",
            "The curve crosses the axis near x = 1.5. Put a on its left and b on its right."],
    answer: "Any interval with a to the left of 1.52 and b to the right works, for example [0, 2] or [1, 3].",
    build(C) {
      let a = 2, b = 3; const live = el("div", { className: "live" });
      const redraw = () => {
        const ok = a < b && f(a) * f(b) < 0;
        P.setView(-1, 3, -6, 12, { xlabel: "x" }); P.fn(f);
        P.seg(Math.min(a, b), 0, Math.max(a, b), 0, { color: ok ? "gold" : "neg", width: 8, cap: "butt", alpha: .9 });
        for (const [x, n] of [[a, "a"], [b, "b"]]) { P.seg(x, 0, x, f(x), { color: signCol(f(x)), dash: true, width: 1.5 });
          P.pt(x, f(x), { color: signCol(f(x)), r: 7 }); P.text(x, 0, n, { dy: f(x) > 0 ? 16 : -16, bold: true, size: 16 }); }
        $("plotTitle").textContent = "Drag the sliders: trap the root between a and b"; P.draw();
        live.innerHTML = `f(a) = ${signed(f(a))}<br>f(b) = ${signed(f(b))}`;
      };
      slider(C, "a", "sa", -1, 3, 0.05, 2, v => { a = v; redraw(); });
      slider(C, "b", "sb", -1, 3, 0.05, 3, v => { b = v; redraw(); });
      C.append(live);
      return () => {
        if (a >= b) return ["wrong", "a must be to the left of b."];
        if (f(a) * f(b) > 0) return ["wrong", `f(${a.toFixed(2)}) and f(${b.toFixed(2)}) have the same sign, so a root is not guaranteed.`];
        return ["done", `f(${a.toFixed(2)})·f(${b.toFixed(2)}) &lt; 0, so [${a.toFixed(2)}, ${b.toFixed(2)}] is a valid starting interval.`];
      };
    } },

  { nav: "Continuity", title: "Why continuity matters",
    instr: `<p>Look at <span class="math">g(x) = 1/x</span> on [−1, 1]. g(−1) = −1 and g(1) = 1, so g(−1)·g(1) &lt; 0.</p><p>Is there a root of g in (−1, 1)?</p>`,
    hints: ["The Intermediate Value Theorem needs two things. Is g continuous on the whole interval?", "What happens to 1/x at x = 0?"],
    answer: "No. 1/x is not continuous at x = 0: it jumps from −∞ to +∞ and never equals 0.",
    build(C) {
      P.setView(-2, 2, -5, 5, { xlabel: "x" });
      P.fn(x => 1 / x, { domain: [-2, -0.15] }); P.fn(x => 1 / x, { domain: [0.15, 2] });
      P.seg(0, -5, 0, 5, { color: "gold", dash: true, width: 2 });
      P.pt(-1, -1, { color: "neg", r: 7 }); P.pt(1, 1, { color: "pos", r: 7 });
      $("plotTitle").textContent = "g(x) = 1/x"; P.draw();
      cards(C, ["Yes, the Intermediate Value Theorem guarantees one", "No, g is not continuous on [−1, 1], so the theorem does not apply", "Yes, at x = 0"]);
      return () => {
        if (!S.choice) return ["wrong", "Choose one of the options."];
        if (S.choice !== 2) return ["wrong", "Look closely at what happens at x = 0."];
        return ["done", "Right! g jumps across the axis at x = 0. Without continuity there is no guarantee."];
      };
    } },

  { nav: "Bisection by hand", title: "Bisection by hand",
    instr: `<p>Run bisection by hand on <b>[a, b] = [1, 2]</b>. For each step:</p>
            <p>1. compute the midpoint <span class="math">c = (a + b)/2</span><br>2. compute <b>f(c)</b> (3 decimals is enough)<br>3. choose the half where f changes sign.</p>`,
    hints: ["c is exactly halfway between a and b: add them and divide by 2.", "For f(c), compute c³ − c − 2. A calculator is fine.",
            "Keep the half whose two endpoints have opposite signs of f."],
    answer: "",
    build(C, T) {
      let a = 1, b = 2, step = 1;
      const lbl = el("div", { className: "steplabel" }); C.append(lbl);
      const ci = field(C, "Midpoint c =", "ans1"), fi = field(C, "f(c) =", "ans2");
      const box = el("div"); C.append(box);
      const setAnswer = () => { const c = (a + b) / 2; T.answer = `c = ${c}, f(c) = ${f(c).toFixed(4)}, keep the ${f(a) * f(c) < 0 ? "left" : "right"} half.`; };
      const newStep = () => {
        lbl.textContent = `Step ${step} of 3:   [a, b] = [${a}, ${b}]`; ci.value = ""; fi.value = ""; box.innerHTML = ""; S.choice = 0;
        cards(box, [`Left half  [${a}, c]`, `Right half  [c, ${b}]`], "Which half contains the root?");
        drawBracket(a, b, `Step ${step}:  [a, b] = [${a}, ${b}]`); setAnswer();
      };
      newStep();
      return () => {
        const c = (a + b) / 2, fc = f(c);
        if (!near(parseNum(ci.value), c)) return ["wrong", "The midpoint is not right yet."];
        P.seg(c, 0, c, fc, { color: signCol(fc), dash: true, width: 2 }); P.pt(c, 0, { color: "ink", r: 5 }); P.draw();
        if (!(Math.abs(parseNum(fi.value) - fc) <= 5e-4)) return ["wrong", `c = ${c} is right. Now check your value of f(c).`];
        P.pt(c, fc, { color: signCol(fc), r: 7 }); P.draw();
        if (!S.choice) return ["wrong", "Good! Now choose which half to keep."];
        const left = f(a) * fc < 0;
        if (S.choice !== (left ? 1 : 2)) return ["wrong", `f(a) = ${f(a).toFixed(3)} and f(c) = ${fc.toFixed(3)}. Which half has endpoints with opposite signs?`];
        if (left) b = c; else a = c;
        if (step < 3) { step++; setTimeout(newStep, 350); return ["step", `Correct! The root is now trapped in [${a}, ${b}]. On to step ${step}.`]; }
        drawBracket(a, b, `After 3 steps:  [a, b] = [${a}, ${b}]`);
        let rows = "", A = a, B = b;
        for (let n = 4; n <= 10; n++) { const m = (A + B) / 2, fm = f(m);
          rows += `<tr><td>${n}</td><td>${A.toFixed(6)}</td><td>${B.toFixed(6)}</td><td class="gold">${m.toFixed(6)}</td><td class="${signCol(fm)}">${fm >= 0 ? "+" : ""}${fm.toFixed(5)}</td></tr>`;
          if (f(A) * fm < 0) B = m; else A = m; }
        C.innerHTML = `<div class="question">The next steps, computed for you:</div><div class="tablewrap"><table class="iter"><thead><tr><th>n</th><th>a</th><th>b</th><th>c</th><th>f(c)</th></tr></thead><tbody>${rows}</tbody></table></div><div class="live">True root: <span class="pos">x* = ${ROOT.toFixed(6)}</span></div>`;
        return ["done", `Excellent! After 3 steps the root is in [${a}, ${b}].`];
      };
    } },

  { nav: "Stopping criteria", title: "Stopping criteria",
    instr: `<p>We stop when the answer is accurate enough. Which stopping test <b>guarantees</b> that |c − x*| &lt; tol?</p><p>The plot shows a clue.</p>`,
    hints: ["In the plot, |f(c)| is tiny at c = 1.25, but c is still 0.25 away from the root.",
            "The root is always inside [a, b] and c is its midpoint. How far can c be from the root?"],
    answer: "(b − a)/2 &lt; tol. The root is inside [a, b], so the midpoint is at most (b − a)/2 away from it.",
    build(C) {
      const tol = 2e-3, g = x => (x - 1.5) ** 5;
      P.setView(1, 2, -0.01, 0.01, { xlabel: "x", yticks: [-0.01, -0.005, 0, 0.005, 0.01] });
      P.band(1, 2, -tol, tol); P.fn(g); P.pt(1.25, g(1.25), { color: "neg", r: 7 }); P.pt(1.5, 0, { color: "pos", r: 8 });
      P.text(1.25, 0.0045, "c = 1.25: |f(c)| < tol", { size: 13 }); P.text(1.5, -0.0045, "root x* = 1.5", { size: 13 });
      P.text(1.88, tol * 1.7, "band |f| < tol", { size: 12, color: "muted" });
      $("plotTitle").textContent = "A very flat function: f(x) = (x − 1.5)⁵"; P.draw();
      cards(C, ["|f(c)| &lt; tol", "(b − a)/2 &lt; tol", "n ≥ Nmax (a maximum number of steps)"]);
      return () => {
        if (!S.choice) return ["wrong", "Choose one of the options."];
        if (S.choice === 1) return ["wrong", "Look at the plot: |f(c)| is small at c = 1.25, but c is far from the root."];
        if (S.choice === 3) return ["wrong", "A cap on the steps is a safety net. It says nothing about accuracy."];
        return ["done", "Right! |c − x*| ≤ (b − a)/2, so this test guarantees the accuracy."];
      };
    } },

  { nav: "Error bound", title: "The error bound",
    instr: `<p>Start with [a, b] = [1, 2]. Drag the slider to see the interval after each halving.</p>
            <p>The n-th midpoint satisfies <span class="math">|cₙ − x*| ≤ (b − a) / 2ⁿ</span>. What is this bound for <b>n = 5</b>? (You may type 1/32.)</p>`,
    hints: ["b − a = 1, so the bound is 1/2⁵.", "You can type the answer as 1/32 or 2^-5."],
    answer: "1/2⁵ = 1/32 = 0.03125.",
    build(C) {
      const bars = n => {
        P.setView(0.95, 2.8, -4.8, 0.8, { xlabel: "x", noY: true, yticks: [] });
        let a = 1, b = 2; const cols = ["curve", "curve", "gold", "gold", "gold"];
        for (let k = 0; k <= n; k++) {
          P.seg(a, -k, b, -k, { color: cols[k], width: 10, cap: "butt", alpha: 1 - k * 0.08 });
          P.text(2.08, -k, `width = 1/2${"⁰¹²³⁴"[k]} = ${1 / 2 ** k}`, { align: "left", size: 13 });
          const c = (a + b) / 2; if (f(a) * f(c) < 0) b = c; else a = c; }
        P.seg(ROOT, -4.8, ROOT, 0.8, { color: "pos", dash: true, width: 2 }); P.text(ROOT, 0.5, "root x*", { color: "pos", align: "left", dx: 6, size: 13 });
        $("plotTitle").textContent = `After ${n} halving${n === 1 ? "" : "s"}`; P.draw();
      };
      slider(C, "halvings", "sn", 0, 4, 1, 0, bars);
      const inp = field(C, "Bound for n = 5:", "ans1");
      return () => {
        const v = parseNum(inp.value);
        if (!Number.isFinite(v)) return ["wrong", "Type a number, for example 0.1 or 1/10."];
        if (near(v, 1 / 16)) return ["wrong", "That is the bound for n = 4. Halve it once more."];
        if (!near(v, 1 / 32)) return ["wrong", "Not quite. Use (b − a)/2ⁿ with n = 5."];
        return ["done", "Correct! After 5 steps the midpoint is within 1/32 = 0.03125 of the root."];
      };
    } },

  { nav: "Number of iterations", title: "How many iterations?",
    instr: `<p>To guarantee an error at most ε we need <span class="math">(b − a)/2ⁿ ≤ ε</span>, i.e. n ≥ log₂((b − a)/ε).</p>
            <p>On [1, 2] with <b>ε = 10⁻⁴</b>, what is the smallest number of iterations n? Use the slider or the formula.</p>`,
    hints: ["Move the slider until the ring first drops below the red line.", `log₂(10⁴) = ${Math.log2(1e4).toFixed(2)}, and n must be a whole number.`],
    answer: "n = 14, because 1/2¹³ ≈ 1.2×10⁻⁴ is too big and 1/2¹⁴ ≈ 6.1×10⁻⁵ ≤ 10⁻⁴.",
    build(C) {
      const live = el("div", { className: "live" });
      const draw = n => {
        P.setView(0, 20, 1e-7, 2, { xlabel: "n", ylog: true, xticks: [0, 4, 8, 12, 16, 20] });
        P.seg(0, 1e-4, 20, 1e-4, { color: "neg", width: 2 }); P.text(19.8, 1e-4, "ε = 10⁻⁴", { color: "neg", align: "right", dy: -10, size: 13 });
        P.fn(k => 2 ** -k, { width: 2 });
        for (let k = 0; k <= 20; k++) P.pt(k, 2 ** -k, { color: "curve", r: 4 });
        P.pt(n, 2 ** -n, { color: "gold", r: 10, ring: true });
        $("plotTitle").textContent = "Error bound 1/2ⁿ on [1, 2] (log scale)"; P.draw();
        const ok = 2 ** -n <= 1e-4;
        live.innerHTML = `n = ${n}: bound = ${(2 ** -n).toExponential(2)} <span class="${ok ? "pos" : "neg"}">${ok ? "≤ ε ✓" : "too big"}</span>`;
      };
      slider(C, "n", "sn", 0, 20, 1, 4, draw); C.append(live);
      const inp = field(C, "Smallest n =", "ans1");
      return () => {
        const v = parseNum(inp.value);
        if (!Number.isFinite(v)) return ["wrong", "Type a whole number."];
        if (v === 13) return ["wrong", "Close! 1/2¹³ ≈ 1.22×10⁻⁴ is still bigger than ε."];
        if (v > 14 && Number.isInteger(v)) return ["wrong", "That works, but it is not the smallest n."];
        if (v !== 14) return ["wrong", "Not quite. Find where the bound first drops below the red line."];
        return ["done", "Correct! 14 iterations guarantee an error of at most 10⁻⁴."];
      };
    } },

  { nav: "When it fails", title: "When bisection fails",
    instr: `<p>Each function below has a root in [0, 2].</p><p>Which one can bisection <b>not</b> find, starting from [0, 2]?</p>`,
    hints: ["Check the sign of each function at x = 0 and at x = 2.", "Look for a curve that touches the axis without crossing it."],
    answer: "(x − 1)². It is positive at both ends and only touches the axis at x = 1, so there is no sign change.",
    build(C) {
      const fs = [[x => x ** 3 - 1, "curve", "x³ − 1"], [x => (x - 1) ** 2, "neg", "(x − 1)²"], [x => x - 1, "pos", "x − 1"], [x => Math.cos(x) - 0.5, "gold", "cos(x) − 0.5"]];
      P.setView(0, 2, -1.5, 2, { xlabel: "x" });
      fs.forEach(([g, c, n], i) => { P.fn(g, { color: c }); P.text(0.05, 1.85 - i * 0.22, "━ " + n, { color: c, align: "left", size: 13, bold: true }); });
      $("plotTitle").textContent = "Four functions, each with a root in [0, 2]"; P.draw();
      const btns = cards(C, fs.map(x => x[2]));
      btns.forEach((b, i) => { b.style.color = `var(--${fs[i][1]})`; b.style.fontWeight = 600; });
      return () => {
        if (!S.choice) return ["wrong", "Choose one of the functions."];
        if (S.choice !== 2) return ["wrong", `${fs[S.choice - 1][2]} changes sign on [0, 2], so bisection can find its root.`];
        return ["done", "Right! (x − 1)² touches the axis without changing sign, so bisection has nothing to grab."];
      };
    } },

  { nav: "The algorithm", title: "Put the algorithm in order",
    instr: `<p>Put the steps of the bisection method in the right order using the menus.</p><p>When it is right, the plot runs the algorithm for you.</p>`,
    hints: ["You need a valid starting interval before anything else.", "Compute c, use it to shrink the interval, then decide whether to stop."],
    answer: "1. Choose a, b with f(a)·f(b) &lt; 0<br>2. Compute the midpoint c = (a + b)/2<br>3. If f(a)·f(c) &lt; 0 set b = c, otherwise set a = c<br>4. If (b − a)/2 &lt; tol stop, otherwise repeat",
    build(C) {
      const steps = ["Choose a, b with f(a)·f(b) < 0", "Compute the midpoint c = (a + b)/2", "If f(a)·f(c) < 0 set b = c, otherwise set a = c", "If (b − a)/2 < tol stop, otherwise repeat"];
      const order = [2, 0, 3, 1];
      const grid = el("div", { className: "order" }); C.append(grid);
      const sels = [0, 1, 2, 3].map(k => {
        const s = el("select", { id: `dd${k + 1}` });
        s.append(el("option", { value: "" }, "— choose —"), ...order.map(i => { const o = el("option", { value: i }); o.textContent = steps[i]; return o; }));
        grid.append(el("label", { htmlFor: `dd${k + 1}`, className: "steplabel" }, `Step ${k + 1}`), s); return s; });
      drawBracket(1, 2, "f(x) = x³ − x − 2 on [1, 2]");
      return () => {
        const v = sels.map(s => s.value);
        if (v.includes("")) return ["wrong", "Choose an option for every step."];
        if (new Set(v).size < 4) return ["wrong", "Each option should be used exactly once."];
        const bad = v.findIndex((x, k) => +x !== k);
        if (bad >= 0) return ["wrong", `Step ${bad + 1} is not in the right place yet.`];
        let a = 1, b = 2, n = 0;
        const tick = () => { const c = (a + b) / 2; if (f(a) * f(c) < 0) b = c; else a = c; n++;
          drawBracket(a, b, `Iteration ${n}:  [a, b] = [${a.toFixed(5)}, ${b.toFixed(5)}]`); if (n < 8) setTimeout(tick, 380); };
        setTimeout(tick, 300);
        return ["done", "Perfect order! Watch the algorithm run on the plot."];
      };
    } },
];

/* ---------------- engine ---------------- */
const P = new Plot($("cv"));
const S = { cur: 0, status: TASKS.map(() => 0), attempts: 0, hintIdx: 0, hintUsed: false, choice: 0, check: null, task: null };
// status: 0 = not done, 1 = solved without help, 2 = solved with help, 3 = answer shown
try { const saved = JSON.parse(localStorage.getItem(STORE) || "null"); if (saved && saved.status?.length === TASKS.length) { S.status = saved.status; S.cur = saved.cur || 0; } } catch {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ status: S.status, cur: S.cur })); } catch {} };

function feedback(kind, msg) {
  const fb = $("feedback"); fb.className = "feedback " + (kind || "");
  fb.innerHTML = !kind ? "" : kind === "ok" ? "✓ " + msg : kind === "bad" ? "✗ " + msg : kind === "hint" ? "<b>Hint:</b> " + msg : msg;
}
function chrome() {
  const segs = $("segs"), nav = $("nav"); segs.innerHTML = ""; nav.innerHTML = "";
  nav.append(el("div", { className: "nav-label" }, "Tasks"));
  TASKS.forEach((t, i) => {
    const s = S.status[i], cls = s === 1 || s === 2 ? "done" : s === 3 ? "shown" : "";
    segs.append(el("div", { className: `seg ${cls || (i === S.cur ? "cur" : "")}` }));
    const b = el("button", { type: "button", className: `nav-item ${cls} ${i === S.cur ? "cur" : ""}` },
      `<span class="mark">${["○", "★", "✓", "!"][s]}</span><span>${i + 1}. ${t.nav}</span>`);
    if (i === S.cur) b.setAttribute("aria-current", "step");
    b.onclick = () => show(i); nav.append(b);
  });
  const n = st => S.status.filter(x => x === st).length;
  nav.append(el("div", { className: "tally" }, `<span>★ ${n(1)} solved first time</span><span>✓ ${n(2)} solved with help</span><span>! ${n(3)} answers shown</span>`));
  $("count").textContent = `${S.status.filter(x => x > 0).length} / ${TASKS.length} done`;
  $("nextBtn").textContent = S.cur === TASKS.length - 1 ? "Finish →" : S.status[S.cur] ? "Next →" : "Skip →";
}
function show(i) {
  S.cur = i; S.attempts = 0; S.hintIdx = 0; S.hintUsed = false; S.choice = 0; save();
  const t = S.task = { ...TASKS[i] };
  $("eyebrow").textContent = `Task ${i + 1} of ${TASKS.length}`; $("title").textContent = t.title; $("instr").innerHTML = t.instr;
  const C = $("controls"); C.innerHTML = ""; feedback("", "");
  ["hintBtn", "revealBtn", "checkBtn"].forEach(id => { $(id).hidden = false; }); $("checkBtn").disabled = false;
  S.check = t.build(C, t); chrome();
}
function onCheck() {
  const [res, msg] = S.check();
  if (res === "done") { if (!S.status[S.cur]) S.status[S.cur] = S.attempts || S.hintUsed ? 2 : 1; feedback("ok", msg); $("checkBtn").disabled = true; save(); }
  else if (res === "step") feedback("ok", msg);
  else { S.attempts++; feedback("bad", msg + (S.attempts >= 2 && S.hintIdx < S.task.hints.length ? " Stuck? Try the <b>Hint</b> button." : "")); }
  chrome();
}
function onHint() { S.hintUsed = true; S.hintIdx = Math.min(S.hintIdx + 1, S.task.hints.length); feedback("hint", S.task.hints[S.hintIdx - 1]); }
function onReveal() { if (!S.status[S.cur]) S.status[S.cur] = 3; save(); feedback("info", "<b>Answer:</b> " + S.task.answer); chrome(); }
function onNext() { if (S.cur < TASKS.length - 1) show(S.cur + 1); else summary(); }
function summary() {
  const solved = S.status.filter(x => x === 1 || x === 2).length, stars = S.status.filter(x => x === 1).length;
  $("eyebrow").textContent = "Complete"; $("title").textContent = "Lecture 1 complete!";
  $("instr").innerHTML = `<p>You solved <b>${solved} of ${TASKS.length}</b> tasks, <b>${stars}</b> of them first time.</p>
    <p>Tasks marked ! or ○ are worth another look: rewatch that part of the video, then pick the task on the left to try again.</p>`;
  const labels = ["not done", "★ first time", "✓ with help", "! answer shown"];
  $("controls").innerHTML = `<div class="tablewrap"><table class="iter"><thead><tr><th style="text-align:left">Task</th><th style="text-align:left">Result</th></tr></thead><tbody>${
    TASKS.map((t, i) => `<tr><td style="text-align:left">${i + 1}. ${t.title}</td><td style="text-align:left">${labels[S.status[i]]}</td></tr>`).join("")}</tbody></table></div>`;
  feedback("ok", `Well done! Score: ${solved} / ${TASKS.length}`);
  ["hintBtn", "revealBtn", "checkBtn"].forEach(id => { $(id).hidden = true; });
  $("nextBtn").textContent = "Start over";
  $("nextBtn").onclick = () => { S.status = TASKS.map(() => 0); $("nextBtn").onclick = onNext; show(0); };
  let a = 1, b = 2; for (let n = 0; n < 12; n++) { const c = (a + b) / 2; if (f(a) * f(c) < 0) b = c; else a = c; }
  drawBracket(a, b, `x* ≈ ${ROOT.toFixed(6)}`); P.pt(ROOT, 0, { color: "gold", r: 9 }); P.draw();
}
$("checkBtn").onclick = onCheck; $("hintBtn").onclick = onHint; $("revealBtn").onclick = onReveal; $("nextBtn").onclick = onNext;
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input[type=text]") && !$("checkBtn").disabled) onCheck(); });
show(S.cur);
</script>
</body></html>
